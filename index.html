<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wisch-Wanda</title>
  <meta name="description" content="Wisch-Wanda – motivierende Haushalts-App für die ganze Familie">
  <meta name="theme-color" content="#0f8b8d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wanda">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <img src="icons/wanda.svg" alt="" class="logo">
    <h1>Wisch-Wanda <span id="sync-dot" class="sync-dot" hidden></span></h1>
    <button id="me-btn" class="me-btn" data-action="me" aria-label="Person wechseln">👩</button>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-tab="heute" class="active"><span>☀️</span>Heute</button>
    <button data-tab="raeume"><span>🏠</span>Räume</button>
    <button data-tab="familie"><span>👨‍👩‍👧</span>Familie</button>
    <button data-tab="einstellungen"><span>⚙️</span>Einstellungen</button>
  </nav>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Datei-Felder liegen außerhalb der neu gezeichneten Bereiche: Auf dem Handy
       kommt die Datei erst nach der Rückkehr aus der Dateiauswahl an. -->
  <input type="file" id="waste-import" hidden>
  <input type="file" id="import" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
